<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude hesapları</title>
    <script>
      // Before first paint, so a dark theme never flashes white. Same rule as src/theme.ts.
      (function () {
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="bg-[#F6F6F7] text-zinc-900 antialiased selection:bg-[#D97757]/25 dark:bg-[#111214] dark:text-zinc-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

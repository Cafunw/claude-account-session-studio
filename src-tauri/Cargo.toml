[package]
name = "claude-account-session-manager"
version = "1.1.0"
description = "Claude Code Multi-Account & Safe Session Synchronization Studio for Windows 11"
authors = ["Claude Account & Session Studio contributors"]
edition = "2021"

[lib]
name = "claude_account_session_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the lock file through other crates; SIMD substring search for the per-line pre-filter.
memchr = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
ureq = { version = "2.10", features = ["json"] }
base64 = "0.22"
notify = "6.1"
tauri-plugin-notification = "2"
uuid = { version = "1.11", features = ["v4"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.14"
